<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Alert</title>
     <!-- Task 1: Greet visitor using alert -->
  <script>
    alert("Hello! Welcome to my website.");
  </script>

  <!-- Task 2: Display error message -->
  <script>
    alert("Error! Please enter a valid password.");
  </script>

  <!-- Task 3: Display message with line break -->
  <script>
    alert("Welcome to JS Land...\nHappy Coding!");
  </script>
</head>
<body>
   <h1>Welcome to JavaScript Alerts Assignment</h1>

  <!-- Task 4: Multiple messages in sequence -->
  <script>
    alert("Welcome to JS Land...");
    alert("Happy Coding!");
    alert("Keep Learning JavaScript!");
  </script>

 <!-- Task 5: Generate message through console -->
  <script>
    console.log("Hello... I can run JS through my web browser's console");
  </script>

  <!-- Task 6: Using alerts in your HTML & CSS project -->
  <p>This is a demo paragraph. Check the alerts above to see JS in action!</p>

  <!-- Task 7: Practice different placements of <script> -->
  <!-- a) Before page HTML -->
  <script>
    alert("This alert is before page HTML!");
  </script>

  <!-- b) Inside page HTML -->
  <script>
    alert("This alert is inside page HTML!");
  </script>


</body>
<!-- c) After page HTML -->
<script>
  alert("This alert is after page HTML!");
</script>

</html>
